<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Registro</title>
    <link th:href="@{/css/main.css}" rel="stylesheet"/>
</head>
<body>
<div class="form-container form-container-narrow">
    <h2>Modificar Registro</h2>
    <p class="auth-subtitle" style="margin-bottom: 1.5rem;">ID Operativo: <span th:text="${usuario.id}"></span></p>

    <form th:action="@{/edit/{id}(id=${usuario.id})}" method="post">

        <div class="form-group">
            <label for="username">Nombre de Usuario</label>
            <input type="text" id="username" name="username" th:value="${usuario.userName}" readonly>
            <p class="hint">El nombre de usuario es inmutable.</p>
        </div>

        <div class="form-group" th:if="${not #lists.isEmpty(usuario.roles)}">
            <label>Roles asignados</label>
            <div class="roles-readonly">
                <span class="badge-role badge-muted" th:each="rol : ${usuario.roles}" th:text="${rol.roleName}"></span>
            </div>
        </div>

        <div class="form-group">
            <label class="checkbox-row">
                <input type="checkbox" name="enabled" th:checked="${usuario.userEnable}">
                Cuenta Activa (Permitir acceso)
            </label>
        </div>

        <div class="actions-row">
            <a th:href="@{/}" class="btn btn-cancel">Cancelar</a>
            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
        </div>
    </form>
</div>
</body>
</html>
