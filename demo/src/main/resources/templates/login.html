<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGBU - Autenticación</title>
    <link th:href="@{/css/main.css}" rel="stylesheet"/>
</head>
<body class="auth-page">

<main class="form-container">
    <div class="auth-logo" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
    </div>
    <h2 class="auth-title">Acceso al Sistema</h2>
    <p class="auth-subtitle">Ingresa tus credenciales para continuar</p>

    <div th:if="${param.error}" class="alert alert-error" role="alert">Credenciales inválidas. Verifica tu usuario y contraseña.</div>
    <div th:if="${param.logout}" class="alert alert-success" role="status">Sesión finalizada correctamente.</div>

    <form th:action="@{/login}" method="post" autocomplete="on">
        <div class="form-group">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" required autocomplete="username" autofocus>
        </div>
        <div class="form-group">
            <label for="password">Contraseña</label>
            <div class="password-field">
                <input type="password" id="password" name="password" required autocomplete="current-password">
                <button type="button" class="password-toggle" aria-label="Mostrar contraseña" onclick="togglePassword(this)">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Autenticar</button>
    </form>
</main>

<script>
    function togglePassword(btn) {
        var input = document.getElementById('password');
        var isHidden = input.type === 'password';
        input.type = isHidden ? 'text' : 'password';
        btn.setAttribute('aria-label', isHidden ? 'Ocultar contraseña' : 'Mostrar contraseña');
    }
</script>
</body>
</html>
