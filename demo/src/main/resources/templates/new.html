<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Registro</title>
    <link th:href="@{/css/main.css}" rel="stylesheet"/>
</head>
<body>
<div class="form-container form-container-narrow">
    <h2>Nuevo Paciente</h2>

    <form th:action="@{/new}" method="post">
        <div class="form-group">
            <label for="username">Nombre del Paciente</label>
            <input type="text" id="username" name="username" required autocomplete="off" autofocus>
        </div>

        <div class="form-group">
            <label for="motivoConsulta">Motivo de Consulta</label>
            <input type="text" id="motivoConsulta" name="motivoConsulta" min="25" max="100" required autocomplete="new-motivoConsulta">
        </div>

        <div class="form-group">
            <label>Horario</label>
            <div class="checkbox-group">
                <label class="checkbox-chip">
                    <span>H. Inicio</span>
                    <input type="time" name="horario">
                    <span>H. Salida</span>
                    <input type="time" name="horario">
                </label>
            </div>
        </div>

        <div class="form-group">
            <label>Médico</label>
            <div class="checkbox-group">
                <label class="checkbox-chip">
                    <span>H. Inicio</span>
                    <input type="time" name="horario">
                    <span>H. Salida</span>
                    <input type="time" name="horario">
                </label>
            </div>
        </div>

        <div class="actions-row">
            <a th:href="@{/}" class="btn btn-cancel">Cancelar</a>
            <button type="submit" class="btn btn-primary">Crear Usuario</button>
        </div>
    </form>
</div>
</body>
</html>
