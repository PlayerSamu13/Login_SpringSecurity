<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Registro</title>
    <link th:href="@{/css/main.css}" rel="stylesheet"/>
</head>
<body>
<div class="form-container form-container-narrow">
    <h2>Nuevo Registro</h2>
    <p class="auth-subtitle" style="margin-bottom: 1.5rem;">Crea una cuenta y asigna sus permisos.</p>

    <form th:action="@{/new}" method="post">
        <div class="form-group">
            <label for="username">Nombre de Usuario</label>
            <input type="text" id="username" name="username" required autocomplete="off" autofocus>
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required autocomplete="new-password">
        </div>

        <div class="form-group" th:if="${not #lists.isEmpty(roles)}">
            <label>Roles</label>
            <div class="checkbox-group">
                <label class="checkbox-chip" th:each="rol : ${roles}">
                    <input type="checkbox" name="roles" th:value="${rol.id}">
                    <span th:text="${rol.roleName}"></span>
                </label>
            </div>
            <p class="hint">Selecciona al menos un rol para que el usuario pueda acceder al sistema.</p>
        </div>

        <div class="actions-row">
            <a th:href="@{/}" class="btn btn-cancel">Cancelar</a>
            <button type="submit" class="btn btn-primary">Crear Usuario</button>
        </div>
    </form>
</div>
</body>
</html>
